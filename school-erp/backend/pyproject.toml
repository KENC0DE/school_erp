[project]
name = "school-erp-backend"
version = "0.1.0"
description = "School ERP instance API (modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "erp-shared",
  "fastapi>=0.122",
  "uvicorn[standard]>=0.38",
  "pydantic-settings>=2.12",
  "sqlalchemy[asyncio]>=2.0.44",
  "alembic>=1.18",
  "aiosqlite>=0.21",
  "PyJWT[crypto]>=2.10",
  "argon2-cffi>=25.1",
  "celery[redis]>=5.6",
  "redis>=6.4",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "jinja2>=3.1",
  "reportlab>=4.4",
  "pypdf>=6.4",
  "qrcode[pil]>=8.2",
  "email-validator>=2.3",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
erp-shared = { workspace = true }
