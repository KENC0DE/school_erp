[project]
name = "erp-shared"
version = "0.1.0"
description = "Contracts and pure utilities shared by the school instance and the control plane"
requires-python = ">=3.12"
dependencies = [
  "PyJWT[crypto]>=2.10",
  "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erp_shared"]
