[project]
name = "erp-controller-api"
version = "0.1.0"
description = "Control plane API for the school ERP platform"
requires-python = ">=3.12"
dependencies = [
  "erp-shared",
  "fastapi>=0.122",
  "uvicorn[standard]>=0.38",
  "pydantic-settings>=2.12",
  "sqlalchemy[asyncio]>=2.0.44",
  "aiosqlite>=0.21",
  "PyJWT[crypto]>=2.10",
  "argon2-cffi>=25.1",
  "httpx>=0.28",
  "email-validator>=2.3",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controller_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
erp-shared = { workspace = true }
